name: Build, verify and release
on:
  push:
    branches: ['master', 'refactor/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Ubuntu 26.04 hosted runner currently uses x86-64-v3 glibc, incompatible with Ivy Bridge emulation.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - run: bun install --linker hoisted
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bash scripts/installer-test.sh
      - run: bun run build
      - run: bun run compile
      - run: bash scripts/smoke.sh
      - name: Install x86 CPU emulator
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user
      - name: Verify standalone on emulated Ivy Bridge (no AVX2)
        run: bash scripts/legacy-cpu-smoke.sh
      - run: bash scripts/docker-smoke.sh
      - run: |
          cp dist/homeserver-fan-control dist/homeserver-fan-control-linux-x64-baseline
          docker save homeserver-fan-control:ci | gzip -n > dist/homeserver-fan-control-docker-linux-amd64.tar.gz
          cp install.sh dist/install.sh
          cd dist
          sha256sum homeserver-fan-control-linux-x64-baseline homeserver-fan-control-docker-linux-amd64.tar.gz install.sh > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release-assets
          path: |
            dist/homeserver-fan-control-linux-x64-baseline
            dist/homeserver-fan-control-docker-linux-amd64.tar.gz
            dist/SHA256SUMS
            dist/install.sh
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/master' && contains(github.event.head_commit.message, '[release]'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-x64-release-assets
          path: dist
      - name: Publish verified alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$(jq -r .version package.json)"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$tag" ]]; then echo 'Tag must match package version'; exit 1; fi
          if gh release view "$tag" >/dev/null 2>&1; then echo "Release already exists: $tag"; exit 0; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "HomeServer Fan Control $tag" --prerelease --notes-file docs/release-notes.md dist/homeserver-fan-control-linux-x64-baseline dist/homeserver-fan-control-docker-linux-amd64.tar.gz dist/SHA256SUMS dist/install.sh
